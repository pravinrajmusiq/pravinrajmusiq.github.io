name: Deploy to GitHub Pages

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install Git LFS
        run: git lfs install

      - name: Pull LFS files
        run: git lfs pull

      - name: Verify LFS files are materialized
        run: |
          check_file() {
            if [ -f "$1" ] && head -c 64 "$1" | grep -q "version https://git-lfs.github.com"; then
              echo "LFS pointer not materialized: $1"
              exit 1
            fi
          }
          check_file "public/videos/rasuah-final-video.mp4"
          check_file "public/videos/1. INTERVIEW BTS PRODUCER AIN 3.mp4"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Add 404 page for SPA routing
        run: cp dist/index.html dist/404.html

      - name: Configure LFS tracking for gh-pages output
        run: |
          git lfs install
          cd dist
          git lfs track "videos/rasuah-final-video.mp4"
          git lfs track "videos/1. INTERVIEW BTS PRODUCER AIN 3.mp4"
          find . -type f -name '*.mp4' -size +95M -exec git lfs track {} \;

      - name: Deploy to gh-pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          branch: gh-pages
          lfs: true
          token: ${{ secrets.GITHUB_TOKEN }}
          git-config-name: github-actions[bot]
          git-config-email: github-actions[bot]@users.noreply.github.com
          commit-message: Deploy ${{ github.sha }}
